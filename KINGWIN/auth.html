<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🔑 ВХОД — KINGWIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif}
body{background: radial-gradient(ellipse at 50% 0%, #5a0f0f 0%, #2a0808 40%, #150505 70%, #0a0202 100%); color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.c{width:100%;max-width:450px}
.auth-box{background:linear-gradient(180deg,rgba(42,8,8,.98),rgba(10,2,2,.98));border:3px solid #d4af37;border-radius:20px;padding:40px 30px;box-shadow:0 0 60px rgba(212,175,55,.5);position:relative;}
.auth-box::before{content:'👑';position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-size:2.5em;filter:drop-shadow(0 0 15px #ffd700);}
h1{text-align:center;font-size:1.8em;font-weight:900;letter-spacing:4px;background:linear-gradient(180deg,#fff8d0,#ffd700 40%,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.subtitle{text-align:center;color:#d4af37;font-size:.7em;letter-spacing:3px;margin-bottom:30px;text-transform:uppercase;opacity:.85}
.auth-warning{display:none;padding:12px;margin-bottom:20px;border-radius:10px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4);color:#ff6b6b;font-size:.85em;text-align:center;font-weight:700;}
.auth-warning.on{display:block}
.tab-btns{display:flex;gap:10px;margin-bottom:24px}
.tab-btn{flex:1;padding:12px;border-radius:12px;border:2px solid #d4af37;background:rgba(0,0,0,.4);color:#d4af37;font-family:Georgia;font-weight:900;font-size:.9em;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:all .2s;}
.tab-btn.active{background:linear-gradient(180deg,#ffd700,#b8860b);color:#0a0505;box-shadow:0 0 20px rgba(255,215,0,.6)}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:#d4af37;font-size:.75em;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.form-group input{width:100%;padding:14px 18px;border-radius:12px;background:rgba(0,0,0,.6);border:2px solid #d4af37;color:#fff;font-size:1em;font-family:Arial;outline:none;transition:all .3s;}
.form-group input:focus{border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.5)}
.form-group input::placeholder{color:#8a6a10}
.btn-submit{width:100%;padding:16px;border-radius:12px;border:3px solid #ffd700;background:linear-gradient(180deg,#ffd700,#b8860b);color:#0a0505;font-family:Georgia;font-weight:900;font-size:1.05em;letter-spacing:2px;cursor:pointer;text-transform:uppercase;margin-top:10px;box-shadow:0 5px 0 #7a5a10;transition:all .15s;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 7px 0 #7a5a10,0 0 30px rgba(255,215,0,.8)}
.btn-submit:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a10}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none!important;box-shadow:none;}
.error-msg{color:#ff6b6b;font-size:.85em;text-align:center;margin-top:10px;min-height:20px;font-weight:700}
.success-msg{color:#1dd1a1;font-size:.85em;text-align:center;margin-top:10px;min-height:20px;font-weight:700}
.back-link{display:block;text-align:center;margin-top:20px;color:#d4af37;text-decoration:none;font-size:.85em;letter-spacing:1px}
.back-link:hover{color:#ffd700}
</style>
</head>
<body>

<div class="c">
  <div class="auth-box">
    <h1>KINGWIN</h1>
    <div class="subtitle">ВОЙДИ ИЛИ ЗАРЕГИСТРИРУЙСЯ</div>

    <div class="auth-warning" id="authWarning">
      🔒 Для доступа к игре нужно войти или зарегистрироваться!
    </div>

    <div class="tab-btns">
      <button type="button" class="tab-btn active" onclick="switchTab('login')" id="tabLogin">ВХОД</button>
      <button type="button" class="tab-btn" onclick="switchTab('register')" id="tabRegister">РЕГИСТРАЦИЯ</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="loginPass" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">🔓 ВОЙТИ</button>
      <div class="error-msg" id="loginError"></div>
    </form>

    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="your@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Никнейм</label>
        <input type="text" id="regNick" placeholder="Король123" maxlength="20" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="regPass" placeholder="Минимум 6 символов" minlength="6" required>
      </div>
      <button type="submit" class="btn-submit" id="regBtn">👑 ЗАРЕГИСТРИРОВАТЬСЯ</button>
      <div class="error-msg" id="regError"></div>
    </form>

    <a href="index.html" class="back-link">← Вернуться на главную</a>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC8PI8bCzGB_tODO6MnOKAjkxXaASbA3vM",
  authDomain: "kingwin-260a8.firebaseapp.com",
  databaseURL: "https://kingwin-260a8-default-rtdb.firebaseio.com",
  projectId: "kingwin-260a8",
  storageBucket: "kingwin-260a8.firebasestorage.app",
  messagingSenderId: "1085884746167",
  appId: "1:1085884746167:web:9962cbc9eb5c876ae78032"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.database();

function $(id){ return document.getElementById(id); }

// Ключ пользователя в Realtime DB = UID из Firebase Auth
// (никаких safeKey(email) больше не нужно!)

function switchTab(tab){
  if(tab === 'login'){
    $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active');
    $('loginForm').style.display = 'block'; $('registerForm').style.display = 'none';
  } else {
    $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active');
    $('loginForm').style.display = 'none'; $('registerForm').style.display = 'block';
  }
}

function handleLogin(e){
  e.preventDefault();
  var email = $('loginEmail').value.trim().toLowerCase();
  var pass = $('loginPass').value;
  var btn = $('loginBtn');
  var err = $('loginError');

  btn.disabled = true; btn.textContent = '⏳ ВХОД...'; err.textContent = '';

  auth.signInWithEmailAndPassword(email, pass)
    .then(function(cred){
      localStorage.setItem('kw_current_user', cred.user.uid);
      err.className = 'success-msg';
      err.textContent = '✅ Вход выполнен!';
      setTimeout(function(){ window.location.href = 'profile.html'; }, 600);
    })
    .catch(function(error){
      var map = {
        'auth/user-not-found': '❌ Пользователь не найден',
        'auth/wrong-password': '❌ Неверный пароль',
        'auth/invalid-email': '❌ Неверный email',
        'auth/too-many-requests': '❌ Слишком много попыток. Подожди.'
      };
      err.textContent = map[error.code] || ('Ошибка: ' + error.message);
      btn.disabled = false; btn.textContent = '🔓 ВОЙТИ';
    });
}

function handleRegister(e){
  e.preventDefault();
  var email = $('regEmail').value.trim().toLowerCase();
  var nick = $('regNick').value.trim();
  var pass = $('regPass').value;
  var btn = $('regBtn');
  var err = $('regError');

  if(pass.length < 6){ err.textContent = '❌ Пароль минимум 6 символов'; return; }

  btn.disabled = true; btn.textContent = '⏳ РЕГИСТРАЦИЯ...'; err.textContent = '';

  auth.createUserWithEmailAndPassword(email, pass)
    .then(function(cred){
      var uid = cred.user.uid;
      var newUser = {
        email: email,
        nick: nick,
        avatar: '👑',
        registeredAt: Date.now(),
        realBalance: 0,
        bonusBalance: 0,
        bonusWager: 0,
        bonusWagerTotal: 0,
        stats: { totalBets: 0, totalWins: 0, biggestWin: 0, gamesPlayed: 0, casesOpened: 0 }
      };
      return db.ref('users/' + uid).set(newUser);
    })
    .then(function(){
      localStorage.setItem('kw_current_user', auth.currentUser.uid);
      err.className = 'success-msg';
      err.textContent = '✅ Аккаунт создан!';
      setTimeout(function(){ window.location.href = 'profile.html'; }, 600);
    })
    .catch(function(error){
      var map = {
        'auth/email-already-in-use': '❌ Этот email уже зарегистрирован',
        'auth/invalid-email': '❌ Неверный email',
        'auth/weak-password': '❌ Слишком слабый пароль'
      };
      err.textContent = map[error.code] || ('Ошибка: ' + error.message);
      btn.disabled = false; btn.textContent = '👑 ЗАРЕГИСТРИРОВАТЬСЯ';
    });
}

var urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('need_auth') === '1') { $('authWarning').classList.add('on'); }
</script>
</body>
</html>
