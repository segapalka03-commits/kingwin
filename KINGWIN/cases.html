// ==================== БАЛАНС ====================
function loadBalance(){
  var uid = localStorage.getItem(CURRENT_USER_KEY);
  if(!uid){ window.location.replace('auth.html?need_auth=1'); return; }

  firebase.database().ref('users/' + uid).once('value').then(function(snapshot){
    var user = snapshot.val();
    if(!user){
      localStorage.removeItem(CURRENT_USER_KEY);
      window.location.replace('auth.html?need_auth=1');
      return;
    }
    B = (user.realBalance || 0) + (user.bonusBalance || 0);
    $('bal').textContent = fmt(B);
  });
}

  B = newTotal;
  $('bal').textContent = fmt(B);
}

// ==================== SAFE CHANGE ====================
async function safeChangeBalance(delta, type){
  var uid = localStorage.getItem(CURRENT_USER_KEY);
  if(!uid) return null;
  var user = firebase.auth().currentUser;
  if(!user) return null;

  try{
    var idToken = await user.getIdToken();
    var resp = await fetch('/.netlify/functions/updateBalance', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + idToken },
      body: JSON.stringify({ delta: delta, type: type || 'game' })
    });
    if(!resp.ok){
      console.error('updateBalance error', resp.status, await resp.text());
      return null;
    }
    var data = await resp.json();
    return data.total;
  }catch(e){
    console.error('safeChangeBalance exception', e);
    return null;
  }
}

var AC = null;
function getAC(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === 'suspended') AC.resume(); return AC; }

function sTick(){
  var c = getAC(); if(!c) return;
  var bs = c.sampleRate * 0.02;
  var buf = c.createBuffer(1, bs, c.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<bs;i++){ var e = Math.pow(1-i/bs, 4); d[i] = (Math.random()*2-1)*e; }
  var n = c.createBufferSource(); n.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500 + Math.random()*300; f.Q.value = 5;
  var g = c.createGain(); g.gain.value = .08;
  n.connect(f); f.connect(g); g.connect(c.destination); n.start();
}

function sLegendary(){ var c = getAC(); if(!c) return; [523,659,784,1047,1319,1568,2093].forEach(function(f,i){ setTimeout(function(){ var o = c.createOscillator(); o.type='triangle'; o.frequency.value=f; var g=c.createGain(); g.gain.setValueAtTime(.25,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.6); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.65); }, i*100) }) }
function sLose(){
  var c = getAC(); if(!c) return;
  var o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(330, c.currentTime); o.frequency.exponentialRampToValueAtTime(180, c.currentTime+.4);
  var g = c.createGain(); g.gain.setValueAtTime(0, c.currentTime); g.gain.linearRampToValueAtTime(.1, c.currentTime+.03); g.gain.exponentialRampToValueAtTime(.001, c.currentTime+.5);
  var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.55);
}

  { id:'royal', name:'ЦАРСКИЙ', icon:'💠', price:10000, rarity:'legendary', items:[{icon:'💵', price:2000, weight:420, rarity:'common'},{icon:'💵', price:6000, weight:280, rarity:'common'},{icon:'💵', price:15000, weight:160, rarity:'common'},{icon:'💰', price:35000, weight:120, rarity:'rare'},{icon:'💰', price:70000, weight:15, rarity:'epic'},{icon:'👑', price:100000, weight:5, rarity:'legendary'}]}
];

function renderCases(){
  var grid = $('casesGrid');
  var html = '';
  for(var i=0;i<CASES.length;i++){
    var c = CASES[i];
    html += '<div class="case-card ' + c.rarity + '">';
    html += '<span class="ic">' + c.icon + '</span>';
    html += '<span class="nm">' + c.name + '</span>';
    html += '<span class="price">₽' + fmt(c.price) + '</span>';
    html += '<span class="peek" onclick="event.stopPropagation();peekCase(\'' + c.id + '\')">👁 Содержимое</span>';
    html += '<div style="margin-top:10px"><button class="btn-open" style="padding:10px 24px;font-size:.85em" onclick="selectCase(\'' + c.id + '\')">🎁 ОТКРЫТЬ</button></div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

function peekCase(id){
  var c = null;
  for(var i=0;i<CASES.length;i++) if(CASES[i].id === id){ c = CASES[i]; break; }
  if(!c) return;
  $('peekTitle').textContent = c.icon + ' ' + c.name;
  $('peekSub').textContent = 'Цена кейса: ₽' + fmt(c.price);
  var html = '';
  var items = c.items.slice().sort(function(a,b){ return b.price - a.price });
  for(var i=0;i<items.length;i++){
    var it = items[i];
    html += '<div class="item-row ' + it.rarity + '"><div class="ic">' + it.icon + '</div><div class="pr">₽' + fmt(it.price) + '</div></div>';
  }
  $('peekItems').innerHTML = html;
  $('peekModal').classList.add('on');
}
function closePeek(){ $('peekModal').classList.remove('on'); }

function selectCase(id){
  if(opening) return;
  var c = null;
  for(var i=0;i<CASES.length;i++) if(CASES[i].id === id){ c = CASES[i]; break; }
  if(!c) return;
  currentCase = c;
  $('casesGrid').style.display = 'none';
  $('openArea').classList.add('on');
  buildScroller();
  $('openBtn').disabled = false;
  $('openBtn').textContent = '📦 ОТКРЫТЬ ЗА ₽' + fmt(c.price);
}
function cancelOpen(){
  if(opening) return;
  $('openArea').classList.remove('on');
  $('casesGrid').style.display = 'grid';
  currentCase = null;
}

function rollItem(caseItems){
  var total = 0;
  for(var i=0;i<caseItems.length;i++) total += caseItems[i].weight;
  var r = Math.random() * total;
  for(var i=0;i<caseItems.length;i++){ r -= caseItems[i].weight; if(r <= 0) return caseItems[i]; }
  return caseItems[0];
}

function buildScroller(){
  var track = $('scrollerTrack');
  var html = '';
  for(var i=0;i<60;i++){
    var item = rollItem(currentCase.items);
    html += '<div class="item-card ' + item.rarity + '"><div class="ic">' + item.icon + '</div><div class="pr">₽' + fmt(item.price) + '</div></div>';
  }
  track.innerHTML = html;
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
}

async function openCase(){
  if(opening || !currentCase) return;
  if(B < currentCase.price){ alert('Мало денег'); return; }

  opening = true;
  $('openBtn').disabled = true;
  $('cancelBtn').disabled = true;
  $('resultDisplay').classList.remove('on');

  // 1) Списываем цену кейса через сервер
  var newTotal = await safeChangeBalance(-currentCase.price, 'bet');
  if(newTotal === null){
    opening = false;
    $('openBtn').disabled = false;
    $('cancelBtn').disabled = false;
    alert('❌ Ошибка списания. Попробуй ещё раз.');
    return;
  }
  setBalDisplay(newTotal);

  // 2) Определяем выигрыш
  var winItem = rollItem(currentCase.items);
  var track = $('scrollerTrack');
  var html = '';
  var WIN_INDEX = 50;
  for(var i=0;i<80;i++){
    var item;
    if(i === WIN_INDEX) item = winItem;
    else item = rollItem(currentCase.items);
    html += '<div class="item-card ' + item.rarity + '"><div class="ic">' + item.icon + '</div><div class="pr">₽' + fmt(item.price) + '</div></div>';
  }
  track.innerHTML = html;
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  void track.offsetWidth;

  var containerWidth = track.parentElement.offsetWidth;
  var itemWidth = 100 + 8;
  var targetX = -(WIN_INDEX * itemWidth) + (containerWidth/2) - (itemWidth/2) + Math.random()*60 - 30;

  track.style.transition = 'transform 5s cubic-bezier(.15,.85,.25,1)';
  track.style.transform = 'translateX(' + targetX + 'px)';

  var tickCount = 0;
  var tickInt = setInterval(function(){ sTick(); tickCount++; if(tickCount > 60) clearInterval(tickInt); }, 80);

  setTimeout(async function(){
    clearInterval(tickInt);
    opening = false;
    $('cancelBtn').disabled = false;

    // 3) Начисляем выигрыш через сервер
    var winTotal = await safeChangeBalance(winItem.price, 'win');
    if(winTotal !== null) setBalDisplay(winTotal);

    var rd = $('resultDisplay');
    rd.classList.add('on');
    if(winItem.price >= currentCase.price){ rd.className = 'result-display on win'; } else { rd.className = 'result-display on lose'; }
    rd.innerHTML = '<div class="big-icon">' + winItem.icon + '</div><div class="big-val">₽' + fmt(winItem.price) + '</div>';

    if(winItem.price >= currentCase.price * 5){ sLegendary(); showFloat('+₽' + fmt(winItem.price), '#feca57'); }
    else if(winItem.price >= currentCase.price){ sWin(); showFloat('+₽' + fmt(winItem.price), '#1dd1a1'); }
    else { sLose(); }

    dropHistory.unshift({ icon: winItem.icon, price: winItem.price, rarity: winItem.rarity });
    if(dropHistory.length > 20) dropHistory.pop();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(dropHistory));
    renderHistory();
    setTimeout(function(){ $('openBtn').disabled = false; }, 500);
  }, 5200);
}

function showFloat(text, color){
  var el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color || '#ffd700';
  el.style.left = '50%'; el.style.top = '50%';
  el.style.transform = 'translateX(-50%)';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2000);
}

function renderHistory(){
  var el = $('historyList');
  if(dropHistory.length === 0){
    el.innerHTML = '<div style="color:#8a6a10;font-size:.85em;font-style:italic">Пока нет дропов</div>';
    return;
  }
  var html = '';
  for(var i=0;i<dropHistory.length;i++){
    var h = dropHistory[i];
    html += '<div class="history-item ' + h.rarity + '"><div class="ic">' + h.icon + '</div><div class="pr">₽' + fmt(h.price) + '</div></div>';
  }
  el.innerHTML = html;
}

// ==================== СТАРТ ====================
try { dropHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { dropHistory = []; }
renderCases();
renderHistory();
loadBalance();

$('openBtn').onclick = openCase;
$('cancelBtn').onclick = cancelOpen;
$('peekModal').onclick = function(e){ if(e.target === this) closePeek(); };
</script>
</body>
</html>
