<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>👤 ПРОФИЛЬ — KINGWIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif}
body{background: radial-gradient(ellipse at 50% 0%, #5a0f0f 0%, #2a0808 40%, #150505 70%, #0a0202 100%); color:#fff;min-height:100vh;padding:20px;display:flex;justify-content:center}
.c{width:100%;max-width:800px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.back{padding:10px 22px;border-radius:12px;background:linear-gradient(180deg,#2a0808,#1a0505);border:2px solid #d4af37;color:#ffd700;text-decoration:none;font-size:.85em;font-weight:700;letter-spacing:2px;transition:all .3s}
.back:hover{transform:translateX(-4px);box-shadow:0 0 25px rgba(212,175,55,.7)}
.bal-box{display:flex;align-items:center;gap:12px;padding:14px 26px;background:linear-gradient(180deg,#2a0808,#1a0505);border:3px solid #d4af37;border-radius:14px;box-shadow:0 0 0 1px #8a6a10 inset,0 0 30px rgba(212,175,55,.5);min-width:210px}
.bal-box .lbl{font-size:.65em;font-weight:700;letter-spacing:3px;color:#d4af37;margin-bottom:4px;text-transform:uppercase}
.bal-box .num{font-size:1.4em;font-weight:700;background:linear-gradient(180deg,#fff8d0,#ffd700 50%,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-variant-numeric:tabular-nums}
.profile-card{background:linear-gradient(180deg,rgba(42,8,8,.98),rgba(10,2,2,.98));border:3px solid #d4af37;border-radius:20px;padding:30px;box-shadow:0 0 60px rgba(212,175,55,.5);margin-bottom:20px;position:relative;overflow:hidden;}
.profile-header{display:flex;align-items:center;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.avatar-big{width:100px;height:100px;border-radius:50%;background:linear-gradient(180deg,#2a0808,#0a0202);border:3px solid #ffd700;box-shadow:0 0 25px rgba(255,215,0,.6);display:flex;align-items:center;justify-content:center;font-size:3.5em;flex-shrink:0;}
.profile-info{flex:1;min-width:200px}
.profile-info .nick{font-size:1.8em;font-weight:900;color:#ffd700;margin-bottom:4px;letter-spacing:1px}
.profile-info .email{font-size:.85em;color:#a89a8a;margin-bottom:8px}
.profile-info .reg-date{font-size:.75em;color:#d4af37;font-style:italic}
.btn-logout{padding:10px 20px;border-radius:10px;border:2px solid #ff6b6b;background:linear-gradient(180deg,#3a0a0a,#1a0505);color:#ff6b6b;font-family:Georgia;font-weight:700;font-size:.8em;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.btn-logout:hover{background:linear-gradient(180deg,#4a0a0a,#2a0505);box-shadow:0 0 20px rgba(255,107,107,.5)}
.btn-withdraw-main{position:relative;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:14px;border-radius:12px;margin-bottom:20px;background:linear-gradient(180deg,#3a0a0a 0%,#1a0505 100%);border:2px solid #ffd700;color:#ffd700;font-family:Georgia;font-weight:900;font-size:1.1em;letter-spacing:2px;cursor:pointer;text-transform:uppercase;}
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid rgba(212,175,55,.2);padding-bottom:10px;flex-wrap:wrap;}
.tab-btn{padding:10px 20px;border-radius:10px;background:transparent;border:1px solid transparent;color:#a89a8a;font-weight:700;font-size:.9em;cursor:pointer;transition:all .2s;}
.tab-btn.active{color:#0a0505;background:linear-gradient(180deg,#ffd700,#b8860b);box-shadow:0 0 15px rgba(255,215,0,.4)}
.tab-content{display:none}
.tab-content.on{display:block}
.game-stat-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(212,175,55,0.1);}
.game-stat-name{color:#ffd700;font-weight:700;font-size:.95em;}
.game-stat-win{color:#1dd1a1;font-weight:900;font-family:Arial;}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,.4);border-radius:10px;margin-bottom:8px;border-left:3px solid #555;}
.history-item.success{border-left-color:#1dd1a1}
.history-item.pending{border-left-color:#feca57}
.history-item.rejected{border-left-color:#ff6b6b}
.hist-info{display:flex;flex-direction:column;gap:4px}
.hist-title{font-weight:700;font-size:.95em}
.hist-date{font-size:.75em;color:#888}
.hist-amount{font-weight:900;font-family:Arial;font-size:1.1em;}
.hist-amount.plus{color:#1dd1a1}
.hist-amount.minus{color:#ff6b6b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:999;backdrop-filter:blur(5px);}
.modal.on{display:flex;}
.modal-box{background:linear-gradient(180deg,#2a0808 0%,#150202 100%);border:2px solid #d4af37;border-radius:16px;width:100%;max-width:400px;padding:24px;}
.modal-title{font-size:1.2em;font-weight:900;color:#ffd700;text-align:center;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:0.75em;color:#d4af37;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.form-group input{width:100%;padding:12px;border-radius:8px;background:rgba(0,0,0,0.5);border:1px solid #d4af37;color:#fff;font-size:1em;font-family:Arial;outline:none;}
.btn-submit{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(180deg,#ffd700,#b8860b);color:#0a0505;font-family:Georgia;font-weight:900;font-size:1em;letter-spacing:1px;cursor:pointer;text-transform:uppercase;margin-top:10px;}
.btn-close-modal{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:transparent;color:#aaa;font-weight:700;cursor:pointer;margin-top:8px;text-transform:uppercase;font-size:0.8em;}
</style>
</head>
<body>

<div class="c">
  <div class="top">
    <a href="index.html" class="back">← НА ГЛАВНУЮ</a>
    <div class="bal-box">
      <span>👑</span>
      <div>
        <div class="lbl">Баланс</div>
        <div class="num">₽<span id="bal">0</span></div>
      </div>
    </div>
  </div>

  <div id="notLoggedIn" style="display:none;text-align:center;padding:60px 20px;">
    <div style="font-size:4em;margin-bottom:20px;">🔒</div>
    <h2 style="color:#ffd700;margin-bottom:15px;">Ты не авторизован</h2>
    <p style="color:#aaa;margin-bottom:25px;">Войди или зарегистрируйся, чтобы увидеть профиль</p>
    <a href="auth.html" class="btn-withdraw-main" style="width: auto; display: inline-block;">🔓 ВОЙТИ</a>
  </div>

  <div id="profileContent" style="display:none">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar-big" id="profileAvatar">👑</div>
        <div class="profile-info">
          <div class="nick" id="profileNick">Игрок</div>
          <div class="email" id="profileEmail">user@mail.com</div>
          <div class="reg-date" id="profileDate">Дата регистрации: —</div>
        </div>
        <button class="btn-logout" onclick="logout()">🚪 ВЫЙТИ</button>
      </div>

      <button class="btn-withdraw-main" onclick="openWithdrawModal()">
        <span>💸 ВЫВЕСТИ СРЕДСТВА</span>
      </button>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('stats', this)">📊 Статистика</button>
        <button class="tab-btn" onclick="switchTab('deposits', this)">💳 Пополнения</button>
        <button class="tab-btn" onclick="switchTab('withdraws', this)">💸 Выводы</button>
      </div>

      <div class="tab-content on" id="tab-stats"><div id="gamesList"></div></div>
      <div class="tab-content" id="tab-deposits"><div id="depositsList"></div></div>
      <div class="tab-content" id="tab-withdraws"><div id="withdrawsList"></div></div>
    </div>
  </div>
</div>

<div class="modal" id="withdrawModal">
  <div class="modal-box">
    <div class="modal-title">💸 Вывод средств</div>
    <div class="form-group">
      <label>Сумма (от 1 500 до 10 000 ₽)</label>
      <input type="number" id="withdrawAmount" placeholder="2000" min="1500" max="10000">
    </div>
    <div class="form-group">
      <label>Банк</label>
      <input type="text" id="withdrawBank" placeholder="Ozon Банк">
    </div>
    <div class="form-group">
      <label>Номер карты</label>
      <input type="text" id="withdrawCard" placeholder="2200 0000 0000 0000">
    </div>
    <button class="btn-submit" onclick="submitWithdraw()">ОТПРАВИТЬ</button>
    <button class="btn-close-modal" onclick="closeWithdrawModal()">ОТМЕНА</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC8PI8bCzGB_tODO6MnOKAjkxXaASbA3vM",
  authDomain: "kingwin-260a8.firebaseapp.com",
  databaseURL: "https://kingwin-260a8-default-rtdb.firebaseio.com",
  projectId: "kingwin-260a8",
  storageBucket: "kingwin-260a8.firebasestorage.app",
  messagingSenderId: "1085884746167",
  appId: "1:1085884746167:web:9962cbc9eb5c876ae78032"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var auth = firebase.auth();

var CURRENT_USER_KEY = 'kw_current_user';
var currentUserData = null;

function $(id){ return document.getElementById(id); }
function fmt(n){ var r = Math.round(n*100)/100; if(r%1===0) return Math.floor(r).toLocaleString('ru-RU'); return r.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' '); }

function getCurrentUid(){ return localStorage.getItem(CURRENT_USER_KEY) || null; }

function loadProfile(){
  var uid = getCurrentUid();
  if(!uid){
    $('notLoggedIn').style.display = 'block';
    $('profileContent').style.display = 'none';
    return;
  }

  db.ref('users/' + uid).once('value').then(function(snapshot){
    var user = snapshot.val();
    if(!user){
      $('notLoggedIn').style.display = 'block';
      $('profileContent').style.display = 'none';
      return;
    }

    currentUserData = user;
    $('notLoggedIn').style.display = 'none';
    $('profileContent').style.display = 'block';

    $('profileAvatar').textContent = user.avatar || '👑';
    $('profileNick').textContent = user.nick || 'Игрок';
    $('profileEmail').textContent = user.email || '—';

    var d = new Date(user.registeredAt || Date.now());
    $('profileDate').textContent = 'Дата регистрации: ' + d.getDate() + '.' + (d.getMonth()+1) + '.' + d.getFullYear();

    var total = (user.realBalance || 0) + (user.bonusBalance || 0);
    $('bal').textContent = fmt(total);

    renderStats(user);
    renderDeposits(uid);
    renderWithdraws(uid);
  });
}

window.switchTab = function(tab, btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('on'); });
  if(btn) btn.classList.add('active');
  $('tab-' + tab).classList.add('on');
};

function renderStats(user){
  var list = $('gamesList');
  var stats = user.stats || {};
  list.innerHTML =
    '<div class="game-stat-row"><div><div class="game-stat-name">Всего ставок</div></div><div class="game-stat-win">₽' + fmt(stats.totalBets || 0) + '</div></div>' +
    '<div class="game-stat-row"><div><div class="game-stat-name">Всего выигрышей</div></div><div class="game-stat-win">₽' + fmt(stats.totalWins || 0) + '</div></div>' +
    '<div class="game-stat-row"><div><div class="game-stat-name">Макс. выигрыш</div></div><div class="game-stat-win">₽' + fmt(stats.biggestWin || 0) + '</div></div>' +
    '<div class="game-stat-row"><div><div class="game-stat-name">Игр сыграно</div></div><div class="game-stat-win">' + (stats.gamesPlayed || 0) + '</div></div>';
}

function renderDeposits(uid){
  var list = $('depositsList');
  list.innerHTML = '<div style="color:#8a6a10;text-align:center;padding:20px;">Загрузка...</div>';

  db.ref('pending_deposits').once('value').then(function(snapshot){
    var data = snapshot.val() || {};
    var arr = [];
    for(var key in data){
      var req = data[key];
      if(req.uid === uid) arr.push(req);
    }

    list.innerHTML = '';
    if(arr.length === 0){
      list.innerHTML = '<div style="color:#8a6a10;text-align:center;padding:20px;font-style:italic;">Нет истории</div>';
      return;
    }

    arr.sort(function(a,b){ return b.date - a.date; }).forEach(function(dep){
      var d = new Date(dep.date);
      var dateStr = d.getDate() + '.' + (d.getMonth()+1) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      var status = dep.status === 'confirmed' ? 'success' : (dep.status === 'pending' ? 'pending' : 'rejected');
      var check = dep.status === 'confirmed' ? '✅' : (dep.status === 'pending' ? '⏳' : '❌');
      var div = document.createElement('div');
      div.className = 'history-item ' + status;
      div.innerHTML =
        '<div class="hist-info"><div class="hist-title">Пополнение</div><div class="hist-date">' + dateStr + '</div></div>' +
        '<div style="display:flex;align-items:center;"><div class="hist-amount plus">+₽' + fmt(dep.total || dep.amount) + '</div><div style="margin-left:10px;">' + check + '</div></div>';
      list.appendChild(div);
    });
  });
}

function renderWithdraws(uid){
  var list = $('withdrawsList');
  list.innerHTML = '<div style="color:#8a6a10;text-align:center;padding:20px;">Загрузка...</div>';

  db.ref('withdraw_requests').once('value').then(function(snapshot){
    var data = snapshot.val() || {};
    var arr = [];
    for(var key in data){
      var req = data[key];
      if(req.uid === uid) arr.push(req);
    }

    list.innerHTML = '';
    if(arr.length === 0){
      list.innerHTML = '<div style="color:#8a6a10;text-align:center;padding:20px;font-style:italic;">Нет истории</div>';
      return;
    }

    arr.sort(function(a,b){ return b.date - a.date; }).forEach(function(req){
      var d = new Date(req.date);
      var dateStr = d.getDate() + '.' + (d.getMonth()+1) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      var status = req.status === 'confirmed' ? 'success' : (req.status === 'pending' ? 'pending' : 'rejected');
      var check = req.status === 'confirmed' ? '✅' : (req.status === 'pending' ? '⏳' : '❌');
      var div = document.createElement('div');
      div.className = 'history-item ' + status;
      div.innerHTML =
        '<div class="hist-info"><div class="hist-title">Вывод на ' + (req.bank || '—') + '</div><div class="hist-date">' + dateStr + '</div></div>' +
        '<div style="display:flex;align-items:center;"><div class="hist-amount minus">-₽' + fmt(req.amount) + '</div><div style="margin-left:10px;">' + check + '</div></div>';
      list.appendChild(div);
    });
  });
}

window.openWithdrawModal = function(){ $('withdrawModal').classList.add('on'); };
window.closeWithdrawModal = function(){ $('withdrawModal').classList.remove('on'); $('withdrawAmount').value=''; $('withdrawBank').value=''; $('withdrawCard').value=''; };

window.submitWithdraw = function(){
  var uid = getCurrentUid();
  if(!uid) return;
  var amount = parseInt($('withdrawAmount').value) || 0;
  var bank = $('withdrawBank').value.trim();
  var card = $('withdrawCard').value.trim();

  if(amount < 1500 || amount > 10000){ alert('Сумма 1500-10000'); return; }
  if(!bank || !card){ alert('Заполните все поля'); return; }

  db.ref('users/' + uid).once('value').then(function(snapshot){
    var user = snapshot.val();
    if(!user) return;
    if((user.realBalance || 0) < amount){ alert('Недостаточно средств'); return; }

    user.realBalance -= amount;
    db.ref('users/' + uid).set(user).then(function(){
      var newReq = {
        uid: uid,
        email: user.email,
        nick: user.nick,
        amount: amount,
        bank: bank,
        card: card,
        status: 'pending',
        date: Date.now()
      };
      db.ref('withdraw_requests').push(newReq).then(function(){
        closeWithdrawModal();
        loadProfile();
        alert('✅ Заявка создана!');
      });
    }).catch(function(err){
      alert('❌ Ошибка: ' + err.message);
    });
  });
};

window.logout = function(){
  if(!confirm('Выйти?')) return;
  auth.signOut().then(function(){
    localStorage.removeItem(CURRENT_USER_KEY);
    window.location.href = 'index.html';
  });
};

auth.onAuthStateChanged(function(user){
  if(user){
    localStorage.setItem(CURRENT_USER_KEY, user.uid);
    loadProfile();
  } else {
    localStorage.removeItem(CURRENT_USER_KEY);
    $('notLoggedIn').style.display = 'block';
    $('profileContent').style.display = 'none';
  }
});
</script>
</body>
</html>
